<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대한민국 3D 지형 지도</title>
  <script src="./korea/config.js"></script>
  <script>
    if ((localStorage.getItem('korea-vworld-key') || window.KOREA_VWORLD_KEY) && new URLSearchParams(location.search).get('map') !== 'open') {
      location.replace('./korea/vworld.html');
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <style>
:root { font-family: system-ui, sans-serif; color: #172923; }
body { margin: 0; }
#map { position: fixed; inset: 0; background: #dce9e3; }
.panel {
  position: absolute; top: 12px; left: 12px; width: min(270px, calc(100vw - 90px));
  background: #fff; padding: 16px; border-radius: 12px;
  box-shadow: 0 3px 20px #193e3426; display: grid; gap: 8px;
  max-height: calc(100dvh - 65px); overflow: auto;
}
.panel a { color: #256052; font-size: .82rem; }
h1 { margin: 0 0 6px; font-size: 1.22rem; }
select, input, button { font: inherit; }
select, input[type=number], button { border: 1px solid #8ba29a; border-radius: 5px; padding: 6px; }
.check { margin-block: 4px; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
input[type=number] { box-sizing: border-box; width: 100%; }
button { grid-column: 1 / -1; background: #21594b; color: white; cursor: pointer; }
output { padding: 8px; background: #eaf4ef; font-size: .9rem; }
#status { margin: 0; font-size: .82rem; }
  </style>
  <script defer src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./korea/map.js"></script>
</head>
<body>
  <main id="map" aria-label="대한민국 3D 지형 지도"></main>
  <aside class="panel">
    <div><a href="./korea/vworld.html">브이월드 3D 지도</a> · <a href="./templates.html">지형 템플릿 뷰어</a></div>
    <h1>대한민국 3D 지형 지도</h1>
    <label for="region">지역 이동</label>
    <select id="region">
      <option value="korea">대한민국 전체</option>
      <option value="seoul">서울 · 광화문</option>
      <option value="bukhansan" selected>서울 · 북한산</option>
      <option value="busan">부산 · 해운대</option>
      <option value="jeju">제주 · 한라산</option>
      <option value="dokdo">독도</option>
    </select>
    <div><label class="check"><input type="checkbox" id="imagery" checked> 위성 영상</label> <label class="check"><input type="checkbox" id="buildings" checked> 3D 건물</label></div>
    <form id="coordinates">
      <label>위도 <input name="lat" type="number" step="any" min="-85" max="85" required></label>
      <label>경도 <input name="lng" type="number" step="any" min="-180" max="180" required></label>
      <button type="submit">이동 및 조회</button>
    </form>
    <output id="elevation" aria-live="polite">지도를 클릭하면 좌표와 DEM 고도가 표시됩니다.</output>
    <p id="status" role="status">지도 데이터를 불러오는 중…</p>
  </aside>
</body>
</html>
