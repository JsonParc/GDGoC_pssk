<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지형 템플릿 뷰어</title>
<style>
:root{
  --bg:#070b10; --panel:rgba(12,18,26,.82); --line:rgba(255,255,255,.09); --text:#e6edf3; --dim:#8b98a7;
  --accent:#5ee6d0; --warn:#ffb547;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

#panel{position:fixed;top:12px;left:12px;bottom:12px;width:330px;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;transition:transform .25s ease}
#panel.closed{transform:translateX(calc(-100% - 24px))}
#panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#panel h1{margin:0;font-size:16px;letter-spacing:-.01em}
#panel header p{margin:4px 0 0;color:var(--dim);font-size:12px}
#scroll{overflow-y:auto;padding:6px 16px 16px;flex:1}
section{padding-top:12px}
section h2{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
section h2 b{color:var(--text);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{position:relative;height:58px;border-radius:9px;border:1px solid var(--line);background:#1a222c center/cover;cursor:pointer;padding:0;overflow:hidden;color:#fff;font:inherit}
.chip span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;line-height:1.2;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72));text-shadow:0 1px 2px #000}
.chip:hover{border-color:rgba(255,255,255,.35)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.chip:focus-visible{outline:2px solid #fff;outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{flex:1;color:var(--dim);font-size:12px}
.row output{font-variant-numeric:tabular-nums;font-size:12px;min-width:48px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
select,button.btn{background:#18212b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
button.btn:hover{border-color:rgba(255,255,255,.3)}
button.btn.primary{background:var(--accent);color:#04211c;border-color:transparent;font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--dim)}
.toggles label{display:flex;gap:5px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent)}
#status{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--dim);z-index:4;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#status.busy{color:var(--warn)}
#status.hide{opacity:0}
#help{position:fixed;right:12px;bottom:12px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--dim);z-index:4;line-height:1.7}
#help kbd{display:inline-block;min-width:18px;padding:0 4px;border-radius:4px;border:1px solid rgba(255,255,255,.2);color:var(--text);font:11px/16px ui-monospace,monospace;text-align:center}
#hud{position:fixed;right:12px;top:12px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:12px ui-monospace,monospace;color:var(--dim);z-index:4}
#toggle{position:fixed;left:12px;top:12px;z-index:6;display:none}
#panel.closed ~ #toggle{display:block}
#close{position:absolute;right:10px;top:10px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
#pad{position:fixed;right:12px;bottom:12px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:4}
#pad button{border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button.on{background:var(--accent);color:#04211c}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:rgba(94,230,208,.14);border-color:rgba(94,230,208,.5);color:var(--text)}
.pane[hidden]{display:none}
.dx-types{grid-template-columns:repeat(4,1fr)}
.dx-chip{height:54px;background:#18212b}
.dx-chip i{position:absolute;top:6px;left:0;right:0;text-align:center;font-style:normal;font-size:18px;line-height:1}
.dx-chip span{background:none;padding:0 4px 5px;text-align:center;font-size:10.5px;color:var(--text)}
.dx-desc,.dx-note{margin:8px 0 0;color:var(--dim);font-size:12px}
.dx-param{margin-top:6px}
.dx-num{display:flex;align-items:center;gap:4px}
.dx-num input{width:76px;background:#18212b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:12px ui-monospace,monospace;text-align:right}
.dx-num input:focus{outline:1px solid var(--accent)}
.dx-num em{font-style:normal;color:var(--dim);font-size:11px;min-width:30px}
.dx-out{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:12px}
.dx-out dt{color:var(--dim)}
.dx-out dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.dx-tag{font-size:10px!important;color:var(--warn)!important;border:1px solid rgba(255,181,71,.4);border-radius:4px;padding:0 5px}
details summary{cursor:pointer;color:var(--dim);font-size:12px}
#dxJson{width:100%;margin-top:8px;background:#0d141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.5 ui-monospace,monospace;resize:vertical}
.dx-err{color:#ff8a7a;font-size:11px}
@media (pointer:coarse){#help{display:none}#pad{display:grid}}
@media (max-width:640px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:55vh;border-radius:14px 14px 0 0}
  #panel.closed{transform:translateY(calc(100% + 12px))}
  #pad{bottom:calc(55vh + 12px)}
  #panel.closed ~ #pad{bottom:12px}
  #toggle{top:auto;bottom:12px}
  #hud{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>

<aside id="panel">
  <button id="close" aria-label="패널 닫기">×</button>
  <header>
    <h1>지형 템플릿 뷰어</h1>
    <a href="./" style="color: #b9e5ff">대한민국 실제 3D 지도 열기</a>
    <p>지형 · 하늘 · 바다를 따로 골라 조합하고 자유롭게 날아다니며 둘러보세요.</p>
    <div class="tabs" role="tablist"><button class="on" data-pane="scroll">템플릿</button><button data-pane="dxPane">재난 시뮬레이션</button></div>
  </header>
  <div id="dxPane" class="pane" style="overflow-y:auto;padding:6px 16px 16px;flex:1" hidden></div>
  <div id="scroll" class="pane">
    <section>
      <h2>지형 <b id="terrainName">—</b></h2>
      <div class="grid" id="terrainGrid"></div>
      <div class="row"><label><input type="checkbox" id="matchLook" checked> 지형에 어울리는 하늘·바다 함께 적용</label></div>
    </section>
    <section>
      <h2>하늘 <b id="skyName">—</b></h2>
      <div class="grid" id="skyGrid"></div>
    </section>
    <section>
      <h2>바다 <b id="seaName">—</b></h2>
      <div class="grid" id="seaGrid"></div>
    </section>
    <section>
      <h2>보기 설정</h2>
      <div class="row"><label for="scale">지형 크기</label><output id="scaleO">×10</output></div>
      <input type="range" id="scale" min="1" max="20" step="1" value="10">
      <div class="row"><label for="quality">지형 해상도</label>
        <select id="quality"><option value="normal">기본 (빠름)</option><option value="high">높음</option><option value="max">최고 (느림)</option></select></div>
      <div class="toggles">
        <label><input type="checkbox" id="sceneryShadows"> 그림자</label>
        <label><input type="checkbox" id="scenerySea"> 파도 시뮬레이션</label>
        <label><input type="checkbox" id="sceneryTrees"> 나무 · 바위</label>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn" id="overview">전체 보기 위치로</button><button class="btn" id="shot">스크린샷</button></div>
    </section>
  </div>
</aside>
<button class="btn" id="toggle">☰ 템플릿</button>

<div id="status" class="busy">불러오는 중…</div>
<div id="hud"></div>
<div id="help">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>E</kbd>/<kbd>Space</kbd> 상승 · <kbd>Q</kbd>/<kbd>C</kbd> 하강<br>
  드래그 시점 회전 · 휠 속도 조절 · <kbd>Shift</kbd> 가속 · <kbd>H</kbd> 패널
</div>
<div id="pad">
  <button data-k="KeyE">⤒</button><button data-k="KeyW">▲</button><button data-k="KeyQ">⤓</button>
  <button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/terrain.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/ocean.js"></script>
<script src="js/scenery.js"></script>
<script src="js/tsunami.js"></script>
<script src="js/disaster.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const SEA_LEVEL = TerrainField.SEA_LEVEL;
const MA = MapAtmosphere, MS = MapScenery;
MA.opts.detail = true;

/* ───── renderer · camera ───── */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0xa9bfcc;
scene.fog = new THREE.Fog(FOG, 3500, 30000);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 60000);
camera.rotation.order = 'YXZ';

/* ───── sky (shader shared with the simulators; atmosphere.js patches in the sky texture) ───── */
const SKY_ZENITH = new THREE.Color(0x2c64a6), SKY_HORIZON = new THREE.Color(FOG);
const SUN_DIR = new THREE.Vector3(-0.55, 0.42, -0.72).normalize(), SUN_COLOR = new THREE.Color(0xfff1d6);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { zenith: { value: SKY_ZENITH }, hor: { value: SKY_HORIZON }, sunDir: { value: SUN_DIR }, sunCol: { value: SUN_COLOR }, t: { value: 0 },
    cloudLit: { value: new THREE.Color(0xffffff) }, cloudDark: { value: new THREE.Color(0x9eabba) }, cover: { value: 0 }, aurora: { value: 0 }, glow: { value: 1 } },
  vertexShader: 'varying vec3 vp; void main(){ vp = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `
    uniform vec3 zenith; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; uniform float t; varying vec3 vp;
    uniform vec3 cloudLit; uniform vec3 cloudDark; uniform float cover; uniform float aurora; uniform float glow;
    float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    const mat2 ROT = mat2(.8, .6, -.6, .8);
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++) { v += a*noise(p); p = ROT*p*2.03 + 17.1; a *= .5; } return v; }
    void main(){
      vec3 d = normalize(vp); float up = max(d.y, 0.);
      vec3 c = mix(hor, zenith, pow(up, .45));
      float sd = max(dot(d, sunDir), 0.);
      c = mix(c, sunCol, pow(sd, 5.)*(1. - up)*.3*min(glow, 2.5));
      c += sunCol * (pow(sd, 900.)*2. + (pow(sd, 18.)*.22 + pow(sd, 3.)*.06)*glow);
      if (d.y > 0.) {
        vec2 uv = d.xz / (d.y + .08) * 1.3 + vec2(t*.006, t*.0025);
        float n = fbm(uv), cv = smoothstep(.5 - cover, .78 - cover, n);
        float lit = fbm(uv*1.9 + vec2(4.3, 1.7) - sunDir.xz*.15);
        vec3 cc = mix(cloudDark, cloudLit, smoothstep(.3, .7, lit)) + sunCol*pow(sd, 6.)*.25;
        c = mix(c, cc, cv * smoothstep(.0, .22, d.y) * .9);
      }
      // 오로라
      if (aurora > 0. && d.y > 0.) {
        vec2 az = normalize(d.xz + 1e-5);
        float fold = fbm(az*2.2 + vec2(t*.006, t*.004));
        float e0 = .1 + .09*fold;
        float above = d.y - e0;
        float prof = smoothstep(-.012, .012, above)*exp(-max(above, 0.)/.13);
        float rays = .45 + .55*noise(az*90. + vec2(t*.05, 0.))*noise(az*23. - vec2(0., t*.03));
        float cover = smoothstep(.38, .62, fbm(az*1.3 + vec2(3.1, t*.003)));
        vec3 col = mix(vec3(.12, 1., .55), vec3(.55, .22, .85), smoothstep(.02, .3, above));
        c += col*prof*rays*cover*aurora*.75*smoothstep(.0, .05, d.y);
      }
      gl_FragColor = vec4(c, 1.);
    }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(50000, 48, 24), skyMat);
sky.renderOrder = -1; scene.add(sky);
const hemi = new THREE.HemisphereLight(0xcfe0ec, 0x1d3440, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(SUN_COLOR, 0.9); sun.position.copy(SUN_DIR).multiplyScalar(8000); scene.add(sun);

/* ───── sea ───── */
const seaMat = MapOcean.material(THREE, { zenith: SKY_ZENITH, horizon: SKY_HORIZON, sunDir: SUN_DIR, sunCol: SUN_COLOR, deep: 0x06304a, shallow: 0x1a6f8c });
seaMat.uniforms.uCloudSh = MA.CLOUD; seaMat.uniforms.uCloudT = MA.TIME;
seaMat.fragmentShader = MA.CLOUD_GLSL + seaMat.fragmentShader.replace('      gl_FragColor = vec4(c, 1.);', '      c *= 1. - uCloudSh*cloudShadow(wp.xz);\n      gl_FragColor = vec4(c, 1.);');
const sea = new THREE.Mesh(MapOcean.geometry(THREE), seaMat);
sea.frustumCulled = false; sea.position.y = SEA_LEVEL; scene.add(sea);
const seaOcean = MapOcean.attach(THREE, renderer, seaMat); seaOcean.setEnabled(MS.opts.sea);
const shadows = MS.shadows(THREE, renderer, sun, scene, SUN_DIR);
MS.colorPipeline(THREE, renderer, seaMat);
const skyEnv = MS.skyEnvironment(THREE, renderer, scene, skyMat, hemi); if (skyEnv) skyEnv.update();
const disaster = DisasterFX.create(THREE, { scene, camera, renderer, skyMat, seaMat, sea, sun, hemi, seaLevel: SEA_LEVEL, getTerrain: () => terrain,
  setView: (p, t) => { camera.position.copy(p); const d = t.clone().sub(p); look.yaw = Math.atan2(-d.x, -d.z); look.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z)); speed = 40; } });

/* ───── templates ───── */
let catalog = null, terrain = null, terrainMesh = null, terrainColor = null, vegetation = null, request = 0;
const state = { terrain: null, sky: null, sea: null };
const ATMO_BASE = { sunAzDir: SUN_DIR.clone(), seaDeep: seaMat.uniforms.deep.value.getHex(), seaShallow: seaMat.uniforms.shallow.value.getHex(),
  cloudLit: skyMat.uniforms.cloudLit.value.getHex(), cloudDark: skyMat.uniforms.cloudDark.value.getHex(), fogNear: scene.fog.near, fogFar: scene.fog.far };
// 바다 템플릿 = 같은 원본에서 나온 하늘 프리셋의 바다값 + 물 맑기 표
let seaSource = {};
function Sea_params(id){
  const p = MA.PRESETS[seaSource[id]] || {}, w = MA.WATER_LOOK[id] || [.2, .6, 0xb4a88a];
  return { deep: p.deep ?? ATMO_BASE.seaDeep, shallow: p.shallow ?? ATMO_BASE.seaShallow, seaState: p.seaState ?? MA.DEFAULT.seaState, clarity: w[0], caps: w[1], sand: w[2] };
}
function Apply_look(){
  MA.apply({ ...ATMO_BASE, skyMat, seaMat, sun, hemi, fog: scene.fog }, state.sky);
  if (state.sea) {
    const s = Sea_params(state.sea), w = seaMat.uniforms;
    w.deep.value.set(s.deep); w.shallow.value.set(s.shallow); w.seaState.value = s.seaState;
    w.uClarity.value = s.clarity; w.uCaps.value = s.caps; MA.SAND.value.set(s.sand);
  }
  renderer.setClearColor(scene.fog.color);
  disaster.rebase(); // 재난 연출은 이 템플릿 값 위에 얹음
  for (const [k, list] of [['sky', 'skies'], ['sea', 'seas']]) $(k + 'Name').textContent = (catalog[list].find(e => e.id === state[k]) || {}).name || '—';
  Mark_selected();
}

/* ───── terrain build (same pipeline as the simulators) ───── */
function Dispose_terrain(){
  MS.dispose(vegetation); vegetation = null;
  if (!terrainMesh) return;
  MS.dispose(terrainMesh.userData.workLights);
  scene.remove(terrainMesh);
  terrainMesh.traverse(o => o.geometry && o.geometry.dispose());
  if (terrainMesh.material.map) terrainMesh.material.map.dispose();
  (terrainMesh.material.userData.paintTextures || []).forEach(t => t.dispose());
  terrainMesh.material.dispose(); terrainMesh = null;
}
function Build_terrain(){
  Dispose_terrain();
  if (!terrain) return;
  const n = terrain.n, step = terrain.meshStep || 1, m = (n - 1) / step + 1, g = new THREE.PlaneGeometry(terrain.size, terrain.size, m - 1, m - 1);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, colors = new Float32Array(m * m * 3);
  for (let i = 0; i < n * n; i++) {
    const x = i % n, z = (i - x) / n; if (x % step || z % step) continue;
    const h = terrain.heights[i] * terrain.scale, f = Math.max(0, Math.min(1, h / Math.max(1, terrain.meta.altMax * terrain.scale)));
    const j = z / step * m + x / step; pos.setY(j, h); colors.set([.27 + f * .34, .34 + f * .3, .22 + f * .3], j * 3);
  }
  g.computeVertexNormals();
  let material;
  if (terrainColor) {
    const map = new THREE.Texture(terrainColor); map.needsUpdate = true; map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    material = terrain.paintMaterial(THREE, new THREE.MeshStandardMaterial({ map, roughness: 1, side: THREE.DoubleSide }), terrain.meta.lut);
  } else { g.setAttribute('color', new THREE.BufferAttribute(colors, 3)); material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, side: THREE.DoubleSide }); }
  // 실제 메시(아치 · 건물 · 크레인)가 있으면 그걸 그리고 높이장은 수면 아래 해저로만
  if (terrain.scene) { const p = g.attributes.position, floor = -6 * terrain.scale; for (let j = 0; j < p.count; j++) if (p.getY(j) > floor) p.setY(j, floor); g.computeVertexNormals(); }
  terrainMesh = new THREE.Mesh(g, material);
  if (terrain.scene) terrainMesh.add(new THREE.Mesh(terrain.sceneGeometry(THREE), material));
  const lights = terrain.Create_work_lights(THREE);
  if (lights) { terrainMesh.add(lights); terrainMesh.userData.workLights = lights; }
  scene.add(terrainMesh); terrainMesh.updateMatrixWorld(true);
  MS.mark(scene);
  Build_vegetation();
}
function Build_vegetation(){
  MS.dispose(vegetation); vegetation = null;
  if (!terrain || !MS.opts.trees) return;
  vegetation = MS.vegetation(THREE, terrain, terrainColor); scene.add(vegetation);
}
const loadImage = src => new Promise(ok => { const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null); img.src = src; });
async function Load_terrain(slug, moveCamera = true){
  const id = ++request, entry = catalog.terrains.find(t => t.slug === slug);
  if (!entry) return;
  state.terrain = slug; Mark_selected(); $('terrainName').textContent = entry.name;
  Status('지형 불러오는 중… ' + entry.name, true);
  try {
    const [buf, sceneData, color] = await Promise.all([
      fetch('data/terrain/' + entry.dataFile).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }),
      TerrainField.loadScene('data/terrain/scenes/', slug).catch(() => null),
      loadImage('data/terrain/' + entry.color),
    ]);
    if (id !== request) return;
    Status('지형 만드는 중… ' + entry.name, true);
    await new Promise(r => setTimeout(r, 30)); // 상태 표시가 먼저 그려지게
    const field = TerrainField.fromQuality({ ...entry }, buf, $('quality').value);
    if (sceneData) field.attachScene(sceneData.meta, sceneData.buffer);
    field.setScale(+$('scale').value);
    if (id !== request) return;
    terrain = field; terrainColor = color;
    Build_terrain();
    if (moveCamera) Overview();
    disaster.terrainChanged();
    Status(`${entry.name} · 한 변 ${(terrain.size / disaster.U() / 1000).toFixed(1)} km (실제)`);
  } catch (e) {
    if (id === request) Status('지형을 불러오지 못했습니다: ' + e.message, true);
  }
}

/* ───── UI: template chips ───── */
const hex = c => '#' + (c >>> 0).toString(16).padStart(6, '0');
function Chip(grid, label, style, onPick, key){
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.key = key; b.title = label;
  Object.assign(b.style, style); b.innerHTML = '<span></span>'; b.firstChild.textContent = label;
  b.addEventListener('click', onPick); grid.append(b); return b;
}
function Build_ui(){
  for (const t of catalog.terrains)
    Chip($('terrainGrid'), t.name, { backgroundImage: `url("data/terrain/${t.color}")`, backgroundSize: '190%' }, () => {
      if ($('matchLook').checked) { const p = catalog.pairs[t.slug]; state.sky = p.sky; state.sea = p.sea; Apply_look(); }
      Load_terrain(t.slug);
    }, 't:' + t.slug);
  for (const s of catalog.skies) {
    const p = MA.get(s.id);
    Chip($('skyGrid'), s.name, { backgroundImage: `linear-gradient(180deg, ${hex(p.zenith)} 0%, ${hex(p.horizon)} 70%, ${hex(p.sun)} 100%)` }, () => { state.sky = s.id; Apply_look(); }, 's:' + s.id);
  }
  for (const s of catalog.seas) {
    const p = Sea_params(s.id);
    Chip($('seaGrid'), s.name, { backgroundImage: `linear-gradient(160deg, ${hex(p.shallow)} 0%, ${hex(p.deep)} 75%)` }, () => { state.sea = s.id; Apply_look(); }, 'w:' + s.id);
  }
}
function Mark_selected(){
  document.querySelectorAll('.chip[data-key]').forEach(b => {
    const [k, v] = b.dataset.key.split(/:(.*)/);
    b.classList.toggle('sel', (k === 't' ? state.terrain : k === 's' ? state.sky : state.sea) === v);
  });
}
let statusTimer = 0;
function Status(text, busy = false){
  const el = $('status'); el.textContent = text; el.classList.toggle('busy', busy); el.classList.remove('hide');
  clearTimeout(statusTimer); if (!busy) statusTimer = setTimeout(() => el.classList.add('hide'), 3500);
}

/* ───── free-fly camera ───── */
const look = { yaw: 0, pitch: -0.35 }, keys = {};
let speed = 150;
function Overview(){
  // 플레이 구역(경계 다각형)이 있으면 그 범위를 기준으로, 없으면 지형 전체
  const b = terrain && terrain.boundary.length ? terrain.boundary : null;
  const half = b ? Math.max(...b.map(p => Math.max(Math.abs(p.x), Math.abs(p.z)))) : terrain ? terrain.size / 2 : 3000;
  camera.position.set(half * .62, Math.max(300, half * .22), half * .62);
  camera.position.y = Math.max(camera.position.y, Ground(camera.position.x, camera.position.z) + 200);
  look.yaw = Math.atan2(camera.position.x, camera.position.z);
  look.pitch = -Math.atan2(camera.position.y, Math.hypot(camera.position.x, camera.position.z) * .9);
  speed = Math.max(60, Math.round(half / 50));
}
function Ground(x, z){ return terrain ? Math.max(SEA_LEVEL, terrain.height(x, z)) : SEA_LEVEL; }
addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea')) return;
  keys[e.code] = true;
  if (e.code === 'KeyH') $('panel').classList.toggle('closed');
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cv = renderer.domElement; let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const k = 0.0032 * (e.pointerType === 'touch' ? 1.4 : 1);
  look.yaw -= (e.clientX - drag.x) * k; look.pitch = Math.max(-1.55, Math.min(1.55, look.pitch - (e.clientY - drag.y) * k));
  drag.x = e.clientX; drag.y = e.clientY;
});
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => { drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); speed = Math.max(10, Math.min(5000, speed * (e.deltaY < 0 ? 1.2 : 1 / 1.2))); }, { passive: false });
document.querySelectorAll('#pad button').forEach(b => {
  const set = on => { keys[b.dataset.k] = on; b.classList.toggle('on', on); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); set(true); try { b.setPointerCapture(e.pointerId); } catch {} });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => set(false));
});
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function Fly(dt){
  camera.rotation.set(look.pitch, look.yaw, 0);
  camera.getWorldDirection(fwd); right.set(-fwd.z, 0, fwd.x).normalize();
  const v = speed * (keys.ShiftLeft || keys.ShiftRight ? 4 : 1) * dt, p = camera.position;
  const ax = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const sx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const ay = (keys.KeyE || keys.Space ? 1 : 0) - (keys.KeyQ || keys.KeyC ? 1 : 0);
  p.addScaledVector(fwd, ax * v).addScaledVector(right, sx * v); p.y += ay * v;
  p.y = Math.min(30000, Math.max(Ground(p.x, p.z) + 3, p.y));
}

/* ───── settings ───── */
MS.bindUI(k => { if (k === 'sea') seaOcean.setEnabled(MS.opts.sea); if (k === 'trees') Build_vegetation(); });
try { const q = localStorage.getItem(TerrainField.QUALITY_KEY); if (q in TerrainField.QUALITIES) $('quality').value = q; } catch {}
$('quality').addEventListener('change', e => { try { localStorage.setItem(TerrainField.QUALITY_KEY, e.target.value); } catch {} if (state.terrain) Load_terrain(state.terrain, false); });
$('scale').addEventListener('input', e => { $('scaleO').textContent = '×' + e.target.value; });
$('scale').addEventListener('change', e => {
  if (!terrain) return;
  const k = +e.target.value / terrain.scale; terrain.setScale(+e.target.value);
  camera.position.multiplyScalar(k); Build_terrain();
  Status(`한 변 ${(terrain.size / disaster.U() / 1000).toFixed(1)} km (실제)`);
});
$('overview').addEventListener('click', Overview);
$('shot').addEventListener('click', () => { const a = document.createElement('a'); a.download = (state.terrain || 'view') + '.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); });
$('close').addEventListener('click', () => $('panel').classList.add('closed'));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => { p.hidden = p.id !== b.dataset.pane; });
}));
DisasterFX.mountUI($('dxPane'), disaster);
$('toggle').addEventListener('click', () => $('panel').classList.remove('closed'));
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ───── loop ───── */
let last = performance.now(), hudT = 0;
function Frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  Fly(dt);
  seaMat.uniforms.t.value += dt; skyMat.uniforms.t.value += dt; MA.TIME.value = seaMat.uniforms.t.value;
  sky.position.copy(camera.position);
  seaOcean.follow(sea, camera);
  shadows.update(camera, terrain ? Math.max(0, terrain.fieldHeight(camera.position.x, camera.position.z)) : 0);
  seaOcean.shadow(sun, shadows.on);
  seaOcean.update(seaMat.uniforms.t.value);
  disaster.update(dt);
  renderer.render(scene, camera);
  disaster.restore();
  if ((hudT += dt) > .25) {
    // 월드 단위 → 실제 m (원본 1단위 = 8 m, 배율 ×10에서 월드 1단위 = 0.8 m)
    hudT = 0; const U = disaster.U(), g = disaster.pickGround(), km = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
    $('hud').textContent = `고도 ${km((camera.position.y - Ground(camera.position.x, camera.position.z)) / U)} (해발 ${km(camera.position.y / U)}) · 속도 ${Math.round(speed * (keys.ShiftLeft || keys.ShiftRight ? 4 : 1) / U)} m/s`
      + (g ? ` · 화면 가운데까지 ${km(g.distanceTo(camera.position) / U)}` : '');
  }
  requestAnimationFrame(Frame);
}

/* ───── start ───── */
fetch('data/catalog.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(c => {
  catalog = c;
  for (const [t, p] of Object.entries(c.pairs)) seaSource[p.sea] = p.sky;
  Build_ui();
  const params = new URLSearchParams(location.search);
  const first = c.terrains.find(t => t.slug === params.get('terrain')) || c.terrains[0], pair = c.pairs[first.slug];
  state.sky = c.skies.some(s => s.id === params.get('sky')) ? params.get('sky') : pair.sky;
  state.sea = c.seas.some(s => s.id === params.get('sea')) ? params.get('sea') : pair.sea;
  Apply_look(); Overview();
  Load_terrain(first.slug).then(() => {
    // ?disaster=typhoon&wind=50&rain=80 처럼 URL로 재난 지정
    const d = params.get('disaster');
    if (d && DisasterFX.TYPES[d]) { const p = {}; for (const q of DisasterFX.TYPES[d].params) if (params.has(q.key)) p[q.key] = +params.get(q.key); disaster.set(d, p); document.querySelector('.tabs [data-pane=dxPane]').click(); }
  });
  requestAnimationFrame(Frame);
}).catch(e => Status('템플릿 목록을 불러오지 못했습니다: ' + e.message, true));
window.Viewer = { THREE, scene, camera, renderer, state, get terrain(){ return terrain; }, Load_terrain, Apply_look, disaster };
// API 연동용: Disaster.set('flood', { rain: 90, hours: 6, drain: 40 }, { 방재시설: [...] }) · Disaster.get()
window.Disaster = { set: (type, params, data) => disaster.set(type, params, data), get: () => disaster.get(), types: DisasterFX.TYPES, Phys: DisasterFX.Phys };
})();
</script>
