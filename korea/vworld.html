<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthPulse | 재난 지도</title>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./map-ui.css">
  <link rel="stylesheet" href="./onboarding.css">
</head>
<body class="map-onboarding">
  <main id="vmap" aria-label="재난 시각화 플랫폼 3D 지도" inert></main>
  <section id="map-start" aria-labelledby="map-start-title">
    <form id="map-start-form">
      <div class="earthpulse-brand"><span class="earthpulse-mark" aria-hidden="true"></span>EarthPulse</div>
      <div class="map-cloud" id="map-cloud" aria-hidden="true">
        <svg viewBox="0 0 112 82" focusable="false">
          <defs>
            <radialGradient id="cloud-clay" cx=".34" cy=".22" r=".9">
              <stop stop-color="#fffffa"/><stop offset=".52" stop-color="#e4f3eb"/><stop offset="1" stop-color="#94b9ab"/>
            </radialGradient>
            <linearGradient id="cloud-shade" x1="0" x2="0" y1="0" y2="1">
              <stop offset=".35" stop-color="#afccc0" stop-opacity="0"/><stop offset="1" stop-color="#6a998a" stop-opacity=".24"/>
            </linearGradient>
            <path id="cloud-shape" d="M24 68C12 68 5 59 6 49c0-11 8-19 19-20 5-16 18-24 33-23 15 1 25 10 29 22 11 1 19 8 20 19 2 12-7 21-20 21Z"/>
          </defs>
          <ellipse cx="56" cy="74" rx="36" ry="4" fill="#11211e" opacity=".28"/>
          <use href="#cloud-shape" fill="url(#cloud-clay)"/>
          <use href="#cloud-shape" fill="url(#cloud-shade)"/>
          <path d="M20 38c4-3 9-4 14-4M39 18c7-5 15-6 23-4" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2.6" stroke-linecap="round"/>
          <g class="cloud-eyes" fill="#314943"><ellipse cx="47" cy="48" rx="3" ry="4"/><ellipse cx="65" cy="48" rx="3" ry="4"/></g>
          <path d="M53 56q3 3 6 0" fill="none" stroke="#46665b" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="map-start-title">어느 지역의 재난을 알아볼까요?</h1>
      <p class="start-description">궁금한 지역을 검색하고, 재난 발생 이력과 위험도를 살펴보세요.</p>
      <div class="start-search">
        <span class="start-search-icon" aria-hidden="true"></span>
        <input type="search" id="start-query" aria-label="지역명 또는 주소" placeholder="지역명 또는 주소" autocomplete="off" maxlength="100">
        <ul id="start-results" aria-label="지역 검색 결과" hidden></ul>
      </div>
      <div class="start-presets" aria-label="빠른 지역 선택">
        <button type="button" data-region="korea" aria-pressed="false">전국</button>
        <button type="button" data-region="seoul" aria-pressed="false">서울</button>
        <button type="button" data-region="busan" aria-pressed="false">부산</button>
        <button type="button" data-region="jeju" aria-pressed="false">제주</button>
      </div>
      <button class="start-submit" type="submit"><span class="start-label">시작하기</span><span class="start-arrow" aria-hidden="true">→</span></button>
      <p class="start-status" id="start-status" role="status"></p>
    </form>
  </section>
  <div id="map-assistant" aria-hidden="true" hidden></div>
  <p id="status" role="status" hidden></p>
  <script src="./config.js"></script>
  <script>
    if (new URLSearchParams(location.search).has('settings')) {
      document.querySelector('#map-start').hidden = true;
      document.querySelector('#vmap').inert = false;
      document.body.classList.remove('map-onboarding');
    }
    const key = localStorage.getItem('korea-vworld-key') || window.KOREA_VWORLD_KEY;
    if (key) {
      const sdk = new URL('https://map.vworld.kr/js/webglMapInit.js.do');
      sdk.search = new URLSearchParams({ version: '3.0', apiKey: key });
      document.write('<script src="' + sdk.href + '"><\/script>');
    }
  </script>
  <section id="location-search" aria-label="위치 검색" hidden>
    <form role="search">
      <span class="search-grip" aria-hidden="true"></span>
      <select name="type" aria-label="검색 유형">
        <option value="place">장소</option>
        <option value="road">도로명 주소</option>
        <option value="parcel">지번 주소</option>
      </select>
      <input name="query" type="search" aria-label="장소 또는 주소" placeholder="장소 또는 주소 검색" required maxlength="100">
      <button type="submit" aria-label="검색" title="검색"><span class="search-icon" aria-hidden="true"></span></button>
    </form>
    <p role="status"></p>
    <ul id="search-results" aria-label="검색 결과"></ul>
  </section>
  <!-- 키 설정 · 지역 이동: 평소엔 숨김, vworld.html?settings=1 일 때만 -->
  <aside hidden>
    <div class="controls"><select id="region" aria-label="지역 이동" disabled>
      <option value="seoul">서울 · 광화문</option>
      <option value="korea">대한민국 전체</option>
      <option value="bukhansan">서울 · 북한산</option>
      <option value="busan">부산 · 해운대</option>
      <option value="jeju">제주 · 한라산</option>
    </select><a href="../index.html?map=open">기존 지도</a></div>
    <details id="settings"><summary>API 키 설정</summary>
    <form id="credentials">
      <label for="api-key">브이월드 WebGL API 키</label>
      <input id="api-key" type="password" autocomplete="off" required>
      <button type="submit">이 브라우저에 저장</button>
      <button type="button" id="forget" hidden>저장된 키 삭제</button>
    </form>
    <a href="https://www.vworld.kr/" target="_blank" rel="noopener">브이월드 키 발급</a>
    </details>
  </aside>
  <section id="disaster-controls" aria-label="좌표와 3D 마커" hidden>
    <output id="elevation" aria-live="polite">지점 선택</output>
    <div class="controls">
      <button type="button" id="place-marker" disabled>3D 마커</button>
    </div>
  </section>
  <script src="../js/disaster.js"></script>
  <script src="../js/atmosphere.js"></script>
  <script>if (new URLSearchParams(location.search).has('settings')) document.querySelector('aside').hidden = false;</script>
  <script type="module" src="./vworld.js"></script>
</body>
</html>
