<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthPulse | 예비 지도</title>
  <!-- 예비 지도: 브이월드가 점검 · 장애로 안 열리면 vworld.html이 자동으로 이리 넘어옴 (키 없이도 열림).
       브이월드 SDK와 같은 CesiumJS 1.99 + AWS 공개 DEM + Sentinel-2 영상 + OpenStreetMap 3D 건물 · 물. 재난 패널 · 효과 코드는 vworld.html과 같음 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.99.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 패널 · 검색 · 버튼 모양은 브이월드 지도와 같은 파일 -->
  <link rel="stylesheet" href="./map-ui.css">
  <style>
    #note { position: absolute; z-index: 2; right: 12px; bottom: 8px; max-width: min(360px, calc(100vw - 24px)); margin: 0; padding: 5px 9px; border-radius: 7px; background: #202c2ce8; color: #f1f5f0; font-size: 12px; }
    #note a { color: #b3e3d2; }
    /* 오른쪽 지도 버튼 (map-nav.js): 브이월드 SDK 버튼과 같은 자리 · 크기 */
    #map-nav { position: absolute; z-index: 4; top: var(--map-panel-top); right: 4px; width: 56px; padding-inline: 8px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 6px; }
    #map-nav button { display: grid; place-items: center; width: 40px; min-height: 40px; padding: 2px 0; border: 1px solid #c8d2ce; border-radius: 3px;
      background: #fff; color: #2b3a36; font: 600 20px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 1px 4px #0003; }
    #map-nav button:hover { background: #eef4f1; }
    #map-nav button small { font-size: 11px; font-weight: 700; }
    #map-nav button:focus-visible { outline: 2px solid #3f8f76; outline-offset: 1px; }
    .map-nav-needle { width: 8px; height: 26px; background: linear-gradient(#e0302b 50%, #2f5fd0 50%); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.99.0/Build/Cesium/Cesium.js"></script>
  <script src="./config.js"></script>
  <script src="../js/disaster.js"></script>
  <script src="../js/atmosphere.js"></script>
</head>
<body>
  <main id="vmap" aria-label="재난 시각화 플랫폼 예비 지도"></main>
  <p id="note">예비 지도 <a href="./vworld.html?retry=1">홈으로</a></p>
  <section id="location-search" aria-label="위치 검색" hidden>
    <form role="search">
      <span class="search-grip" aria-hidden="true"></span>
      <select name="type" aria-label="검색 유형">
        <option value="place">장소</option>
        <option value="road">도로명 주소</option>
        <option value="parcel">지번 주소</option>
      </select>
      <input name="query" type="search" aria-label="장소 또는 주소" placeholder="장소 또는 주소 검색" required maxlength="100">
      <button type="submit" aria-label="검색" title="검색"><span class="search-icon" aria-hidden="true"></span></button>
    </form>
    <p role="status"></p>
    <ul id="search-results" aria-label="검색 결과"></ul>
  </section>
  <section id="disaster-controls" aria-label="좌표와 3D 마커" hidden>
    <output id="elevation" aria-live="polite">지점 선택</output>
    <div class="controls"><button type="button" id="place-marker" disabled>3D 마커</button></div>
  </section>
  <script type="module" src="./backup.js"></script>
</body>
</html>
